<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250">
  <defs>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="cardGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="cardGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#30cfd0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#330867;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="250" fill="#f8f9fa"/>
  
  <!-- Feature Card 1 - 7 Modules -->
  <g transform="translate(30, 30)" filter="url(#shadow)">
    <rect width="150" height="180" rx="12" fill="url(#cardGrad1)"/>
    <text x="75" y="45" font-family="Arial, sans-serif" font-size="42" fill="white" text-anchor="middle" font-weight="bold">7</text>
    <text x="75" y="75" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">Modules</text>
    <g transform="translate(35, 95)">
      <circle cx="10" cy="10" r="3" fill="white" opacity="0.7"/>
      <circle cx="30" cy="10" r="3" fill="white" opacity="0.7"/>
      <circle cx="50" cy="10" r="3" fill="white" opacity="0.7"/>
      <circle cx="70" cy="10" r="3" fill="white" opacity="0.7"/>
      <circle cx="20" cy="30" r="3" fill="white" opacity="0.7"/>
      <circle cx="40" cy="30" r="3" fill="white" opacity="0.7"/>
      <circle cx="60" cy="30" r="3" fill="white" opacity="0.7"/>
    </g>
    <text x="75" y="155" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" opacity="0.9">Basic to Advanced</text>
  </g>
  
  <!-- Feature Card 2 - 50+ Programs -->
  <g transform="translate(200, 30)" filter="url(#shadow)">
    <rect width="150" height="180" rx="12" fill="url(#cardGrad2)"/>
    <text x="75" y="45" font-family="Arial, sans-serif" font-size="42" fill="white" text-anchor="middle" font-weight="bold">50+</text>
    <text x="75" y="75" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">Programs</text>
    <g transform="translate(40, 90)">
      <rect x="0" y="0" width="70" height="8" rx="4" fill="white" opacity="0.3"/>
      <rect x="0" y="15" width="50" height="8" rx="4" fill="white" opacity="0.3"/>
      <rect x="0" y="30" width="60" height="8" rx="4" fill="white" opacity="0.3"/>
      <rect x="0" y="45" width="45" height="8" rx="4" fill="white" opacity="0.3"/>
    </g>
    <text x="75" y="155" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" opacity="0.9">Clean Code</text>
  </g>
  
  <!-- Feature Card 3 - Commented -->
  <g transform="translate(370, 30)" filter="url(#shadow)">
    <rect width="150" height="180" rx="12" fill="url(#cardGrad3)"/>
    <text x="75" y="50" font-family="Arial, sans-serif" font-size="36" fill="white" text-anchor="middle">💬</text>
    <text x="75" y="90" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">Well</text>
    <text x="75" y="110" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">Commented</text>
    <text x="30" y="140" font-family="'Courier New', monospace" font-size="10" fill="white" opacity="0.7">// Explain</text>
    <text x="30" y="155" font-family="'Courier New', monospace" font-size="10" fill="white" opacity="0.7">// Learn</text>
  </g>
  
  <!-- Feature Card 4 - 17 Patterns -->
  <g transform="translate(540, 30)" filter="url(#shadow)">
    <rect width="150" height="180" rx="12" fill="url(#cardGrad4)"/>
    <text x="75" y="45" font-family="Arial, sans-serif" font-size="42" fill="white" text-anchor="middle" font-weight="bold">17</text>
    <text x="75" y="75" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">Patterns</text>
    <g transform="translate(50, 90)" fill="white" opacity="0.5">
      <text x="0" y="0" font-family="monospace" font-size="18">*</text>
      <text x="-10" y="20" font-family="monospace" font-size="18">**</text>
      <text x="-20" y="40" font-family="monospace" font-size="18">***</text>
    </g>
    <text x="75" y="155" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" opacity="0.9">Stars & Numbers</text>
  </g>
  
  <!-- Feature Card 5 - Array Algorithms -->
  <g transform="translate(710, 30)" filter="url(#shadow)">
    <rect width="150" height="180" rx="12" fill="url(#cardGrad5)"/>
    <text x="75" y="50" font-family="Arial, sans-serif" font-size="36" fill="white" text-anchor="middle">🔢</text>
    <text x="75" y="90" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">Array</text>
    <text x="75" y="110" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">Algorithms</text>
    <g transform="translate(30, 120)" fill="white" opacity="0.5">
      <rect x="0" y="0" width="15" height="15" rx="2"/>
      <rect x="20" y="0" width="15" height="15" rx="2"/>
      <rect x="40" y="0" width="15" height="15" rx="2"/>
      <rect x="60" y="0" width="15" height="15" rx="2"/>
      <rect x="80" y="0" width="15" height="15" rx="2"/>
    </g>
    <text x="75" y="155" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" opacity="0.9">1D & 2D Arrays</text>
  </g>
  
  <!-- Title -->
  <text x="500" y="235" font-family="Arial, sans-serif" font-size="18" fill="#2c3e50" text-anchor="middle" font-weight="bold">✨ Everything You Need to Master Java ✨</text>
</svg>
